<!doctype html>
<!--
  Source of og-image-cs.png (1200×630), the Czech twin of og-image.html.
  Not published: excluded in _config.yml.
  Render it as described in README.md, "Open Graph image".
-->
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>og-image-cs</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .og {
        position: relative;
        height: 100%;
        padding: 102px 101px 0 72px;
        display: grid;
        grid-template-columns: 1fr 242px;
        column-gap: 40px;
      }

      .og .nav-logo {
        font-size: 1.62rem;
        gap: 0.9rem;
      }

      .og .logo-mark {
        width: 46px;
        height: 46px;
        border-radius: 11px;
        font-size: 1.15rem;
      }

      .og .hero-name {
        display: block;
        margin-top: 46px;
        font-size: 1.16rem;
        letter-spacing: 0.3em;
      }

      .og .hero-claim {
        display: block;
        margin-top: 12px;
        font-size: 66px;
      }

      .og-chips {
        display: flex;
        gap: 10px;
        margin-top: 44px;
      }

      .og-chips .tag {
        font-size: 0.97rem;
        padding: 0.55rem 1rem;
        border-color: var(--line-2);
      }

      .og .portrait {
        width: 242px;
        align-self: center;
        margin-top: -102px;
      }

      .og .portrait::before {
        animation: none;
      }

      .og .portrait-frame {
        border-radius: 22px;
        box-shadow: 0 0 48px -8px rgba(77, 141, 255, 0.55);
      }

      .og .portrait-frame img {
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div>
        <span class="nav-logo">
          <span class="logo-mark">R</span>
          <span class="logo-text">roblib<span>.dev</span></span>
        </span>
        <span class="hero-name">Robert Libšanský</span>
        <span class="hero-claim">
          Full stack vývojář<br />pro
          <span class="grad-text">web, iOS<br />a hry</span>.
        </span>
        <div class="og-chips">
          <span class="tag">17 vydaných projektů</span>
          <span class="tag">6 aplikací v App Storu</span>
          <span class="tag">Praha, CZ</span>
        </div>
      </div>
      <div class="portrait">
        <div class="portrait-frame">
          <img src="profile.jpeg" alt="" width="240" height="240" />
        </div>
      </div>
    </div>
  </body>
</html>
